name: iculink
description: "ICULink – Real-time Medical Routing System for Bangladesh"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # Push notification display
  flutter_local_notifications: ^18.0.1

  # Mapping (free OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # HTTP for routing API
  http: ^1.2.2

  # GPS / Geolocation
  geolocator: ^12.0.0

  # Audio alarm
  audioplayers: ^6.1.0

  # Icons
  lucide_icons: ^0.257.0

  # Utility
  uuid: ^4.4.2
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
